# pytest configuration for iVote Systems

[pytest]
DJANGO_SETTINGS_MODULE = ivs_backend.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*

# Test discovery paths
testpaths = 
    accounts
    elections
    voting
    auditing
    tests

# Minimum test coverage percentage
addopts = 
    --cov=accounts
    --cov=elections
    --cov=voting
    --cov=auditing
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers for test categorization
markers =
    unit: Unit tests
    integration: Integration tests
    security: Security tests
    performance: Performance tests
    slow: Tests that take a long time
    api: API endpoint tests
    models: Model tests
    views: View/ViewSet tests
    auth: Authentication tests
    voting: Voting system tests
    elections: Election management tests
    auditing: Audit and monitoring tests

# Django-specific settings
django_find_project = false
django_db_modify_name_prefix = test_

# Coverage configuration
[coverage:run]
source = 
    accounts
    elections
    voting
    auditing
branch = True
omit = 
    */tests.py
    */test_*.py
    */__pycache__/*
    */migrations/*
    */admin.py
    */apps.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

[coverage:html]
directory = coverage_html_report
