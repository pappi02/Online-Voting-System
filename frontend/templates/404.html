{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="text-center" style="padding: 100px 0;">

    <h2 class="mb-4">Page Not Found</h2>

    </a>
</div>
{% endblock %}
